<main>
    <h2>Customer Enquiry Form</h2>

    <form id="enquiryForm">
        <label for="customerName">Full Name:</label>
        <input type="text" id="customerName" required>

        <label for="customerEmail">Email Address:</label>
        <input type="email" id="customerEmail" required>

        <label for="customerPhone">Phone Number:</label>
        <input type="tel" id="customerPhone" required>

        <label for="enquiryType">Select Service:</label>
<select id="enquiryType" required>
    <option value="">Select a service</option>
    <option value="Car Servicing">Car Servicing</option>
    <option value="Engine Diagnostics">Engine Diagnostics</option>
    <option value="Brake Services">Brake Services</option>
    <option value="Car Maintenance">Car Maintenance</option>
    <option value="Parts">Car Parts</option>
    <option value="Other">Other</option>
</select>

        <label for="customerMessage">Your Message:</label>
        <textarea id="customerMessage" rows="5" required></textarea>

        <button type="submit">Submit Enquiry</button>
    </form>

    <p id="enquiryMessage"></p>
</main>
